name: 페이지 배포
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
  # 자동 작업의 결과 커밋(GITHUB_TOKEN 푸시)은 push 트리거를 일으키지 않음 → 발행 작업 완료 시 배포
  workflow_run:
    workflows: ["상한가 예측", "발행 데이터 암호화"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
