name: 상한가 예측
run-name: "상한가 예측 ${{ github.event_name == 'schedule' && '자동' || '수동' }}"

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "빠른 시험(3개월 검증)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/daily.yml]
  schedule:
    # 평일 아침 07:20 KST (22:20 UTC 전날). 수집·학습 후 08:30 전에 페이지 갱신.
    - cron: "20 22 * * 0-4"

permissions:
  contents: write

concurrency:
  group: stock-daily
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_MODE: real
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r stock/requirements.txt anthropic
      - uses: actions/cache@v4
        with:
          path: stock/cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-
      - name: 수집
        run: |
          python -m stock.collect
          python -m stock.collect_text
          python -m stock.collect_extra
      - name: 증권사 계좌 스냅샷
        run: |
          if [ -n "$KIS_APP_KEY" ]; then python -m stock.kis snapshot || echo "[kis] 조회 실패 → 계좌 없이 진행"; fi
      - name: 토론방 증분 수집
        run: |
          if git fetch -q --depth=1 origin board-data 2>/dev/null; then git --work-tree=stock/data checkout -q FETCH_HEAD -- . ; git reset -q; fi
          python -m stock.collect_board || echo "[board] 수집 실패 → 기존 자료로 진행"
          if [ -f stock/data/board.parquet ]; then
            mkdir -p /tmp/bd && cp stock/data/board.parquet stock/data/board_state.json /tmp/bd/
            (cd /tmp/bd && git init -q -b board-data && git config user.name github-actions && git config user.email actions@github.com && git add -A && git commit -qm "board $(date -u +%Y%m%dT%H%M)" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" board-data) || echo "[board] 브랜치 갱신 실패"
          fi
      - name: 학습·예측
        run: |
          # 장중 기록(진입·청산)을 채점에 사용
          if git fetch -q --depth=1 origin live 2>/dev/null; then mkdir -p stock/data/live_trades; git --work-tree=stock/data/live_trades checkout -q FETCH_HEAD -- trades 2>/dev/null && mv stock/data/live_trades/trades/* stock/data/live_trades/ 2>/dev/null; git reset -q; fi
          ls stock/data/live_trades 2>/dev/null | tail -3
          # 지난 실행의 검증 결과(완료된 달)를 재사용: 코드·변수가 같으면 이번 달만 새로 계산
          if git fetch -q --depth=1 origin stock-data 2>/dev/null; then for t in y_up y_oc10 y_lock; do git --work-tree=stock/data checkout -q FETCH_HEAD -- oos_$t.parquet oos_$t.key 2>/dev/null || true; done; git reset -q; fi
          ls -la stock/data/oos_* 2>/dev/null || echo "[wf] 캐시 없음"
          python -m stock.run ${{ inputs.fast && '--fast' || '' }}
      - name: 데이터 브랜치 갱신
        run: |
          cd stock/data
          rm -f panel.parquet board.parquet board_state.json kis_account.json
          git init -q -b stock-data
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "data $(date -u +%Y%m%dT%H%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" stock-data
      - name: 결과 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          # 생성 결과만 최신 main 위에 얹어 커밋(화면 코드가 그사이 바뀌어도 충돌 없음)
          # 비밀번호가 설정되어 있으면 남은 평문을 모두 암호화(최초 1회 변환 포함)
          python -m stock.crypt docs/latest.json docs/scores.json docs/perf.json docs/history/*.json
          rm -rf /tmp/out && mkdir -p /tmp/out
          for f in latest.json latest.json.enc scores.json scores.json.enc perf.json perf.json.enc history; do [ -e "docs/$f" ] && cp -r "docs/$f" /tmp/out/; done
          git fetch -q origin ${{ github.ref_name }}
          git reset -q --hard origin/${{ github.ref_name }}
          if [ -n "$PAGE_PASSWORD" ]; then rm -f docs/latest.json docs/scores.json docs/perf.json docs/history/*.json; else rm -f docs/*.json.enc docs/history/*.json.enc; fi
          cp -r /tmp/out/. docs/
          git add docs
          git diff --cached --quiet || git commit -qm "상한가 예측 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do git push -q origin HEAD:${{ github.ref_name }} && break; git pull -q --rebase origin ${{ github.ref_name }}; sleep 5; done
