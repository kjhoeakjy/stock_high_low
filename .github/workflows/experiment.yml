name: 모델 실험
run-name: "모델 실험 ${{ inputs.names }}"
on:
  workflow_dispatch:
    inputs:
      names:
        description: "실험 이름(쉼표 구분, stock/experiment.py CONFIGS)"
        default: "base,rank,buyable,oc10"
      months:
        description: "검증 개월 수"
        default: "6"
  push:
    branches: [main]
    paths: [.github/workflows/experiment.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          names="${{ inputs.names || 'base' }}"
          echo "matrix=$(echo "$names" | tr ',' '\n' | sed 's/ //g' | grep . | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))")" >> $GITHUB_OUTPUT
  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r stock/requirements.txt
      - name: 데이터 받기
        run: |
          git fetch -q --depth=1 origin stock-data
          mkdir -p stock/data
          git --work-tree=stock/data checkout -q FETCH_HEAD -- .
          git reset -q
          ls -la stock/data | head
      - name: 실험
        run: python -m stock.experiment ${{ matrix.name }} --months=${{ inputs.months || '6' }}
