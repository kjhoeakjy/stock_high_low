name: 브랜치 정리
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 자료·화면 브랜치 외 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep='^(main|live|stock-data|study-data|minute-data|board-data|llm-data|exp-ckpt)$'
          gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name' | while read -r b; do
            if echo "$b" | grep -Eq "$keep"; then continue; fi
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null && echo "삭제 1건"
          done
