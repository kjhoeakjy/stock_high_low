name: 장전 NXT 프리마켓 수집
run-name: "장전 수집 ${{ github.event_name == 'schedule' && '자동' || (inputs.probe && '점검' || '수동') }}"
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "API 응답 형식만 점검(저장·푸시 없음)"
        type: boolean
        default: false
      force:
        description: "장전 시간대 밖에도 스냅샷 1회 저장"
        type: boolean
        default: false
  schedule:
    # 평일 07:45 KST 시작(= UTC 전날 22:45) → 08:00~09:02 KST 동안 반복 수집. 예약 지연 대비 08:15 KST 예비 실행(같은 그룹에서 순차 대기).
    - cron: "45 22 * * 0-4"
    - cron: "15 23 * * 0-4"
permissions:
  contents: write
concurrency:
  group: stock-premarket
  cancel-in-progress: false
jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_MODE: real
      STOCK_DATA: ${{ github.workspace }}/stock/data
      PREMARKET_OUT: ${{ github.workspace }}/pm/premarket
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/code
        with:
          token: ${{ secrets.CODE_TOKEN }}
          repo: ${{ vars.CODE_REPO }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas pyarrow
      - name: 후보 목록 자료 받기(stock-data 브랜치)
        run: |
          mkdir -p stock/data
          if git fetch -q --depth=1 origin stock-data 2>/dev/null; then
            git --work-tree=stock/data checkout -q FETCH_HEAD -- 'oos_y_oc10.parquet*' universe.json 2>/dev/null || true; git reset -q
          fi
          ls -la stock/data/oos_y_oc10.parquet stock/data/universe.json 2>/dev/null || echo "[premarket] 후보 자료 없음 → 삼성전자만 점검"
      - name: 자료 복호화(stock-data의 암호화 파일)
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: pip install -q cryptography >/dev/null 2>&1 || true; python -m stock.crypt dec "stock/data/*.enc"
      - name: 기록 브랜치 받기(premarket-data)
        run: |
          if git fetch -q --depth=1 origin premarket-data 2>/dev/null; then
            mkdir -p pm && git --work-tree=pm checkout -q FETCH_HEAD -- . && git reset -q
          fi
          mkdir -p pm/premarket
          cd pm && git init -q -b premarket-data && git config user.name github-actions && git config user.email actions@github.com
      - name: API 응답 점검
        if: ${{ inputs.probe }}
        run: python -m stock.premarket --probe
      - name: 장전 스냅샷 수집
        if: ${{ !inputs.probe }}
        run: |
          push() {
            cd pm && git add -A
            if git commit -qm "premarket $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M:%S)" >/dev/null 2>&1; then
              git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" premarket-data || echo "[premarket] 푸시 실패"
            fi
            cd ..
          }
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m stock.premarket --force || echo "[premarket] rc=$?"; push; exit 0
          fi
          # 08:00 전이면 대기, 08:00~08:50 5분 간격, 08:50~09:02 1분 간격으로 저장하고 매번 푸시
          while :; do
            hm=$(TZ=Asia/Seoul date +%H%M); dow=$(TZ=Asia/Seoul date +%u)
            [ "$dow" -ge 6 ] && { echo "[premarket] 주말"; break; }
            [ "$hm" \> "0902" ] && break
            if [ "$hm" \< "0800" ]; then sleep 20; continue; fi
            rc=0; python -m stock.premarket || rc=$?
            [ "$rc" = 3 ] && break
            push
            if [ "$hm" \< "0850" ]; then sleep 300; else sleep 60; fi
          done
          echo "[premarket] 종료"
