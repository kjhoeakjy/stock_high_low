name: 장중 실시간
run-name: "장중 실시간 ${{ github.event_name == 'schedule' && '자동' || '수동' }}"
on:
  workflow_dispatch:
    inputs:
      force:
        description: "장외 시간에도 실행"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/live.yml]
  schedule:
    # 평일 09:00~15:40 KST(00:00~06:40 UTC) 5분 간격. 실제 실행은 몇 분 늦을 수 있음.
    - cron: "*/5 0-6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: stock-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: live 브랜치 받기
        run: |
          git fetch -q origin live:live || true
          mkdir -p live
          if git rev-parse -q --verify live >/dev/null; then git --work-tree=live checkout -q live -- . || true; git checkout -q main 2>/dev/null || true; fi
          ls live | head
      - name: 스냅샷
        run: python -m stock.live live ${{ inputs.force && '--force' || '' }}
      - name: live 브랜치 올리기
        run: |
          cd live
          if [ ! -f live.json ]; then echo "변경 없음"; exit 0; fi
          git init -q -b live 2>/dev/null || true
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "live $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M)" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" live
