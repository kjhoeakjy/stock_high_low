name: 접속 점검
on:
  workflow_dispatch:
    inputs:
      script:
        description: "stock/tools/ 아래 스크립트 이름"
        default: "probe8.sh"
  push:
    paths: [.github/workflows/probe.yml, stock/tools/probe*.sh]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash stock/tools/${{ inputs.script || 'probe8.sh' }}
