<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOOD LUCK</title>
<style>
:root{--bg:#0b0d10;--fg:#e6e8ec;--mut:#8a909b;--dim:#5c626d;--up:#f0565c;--dn:#4f8cf7;--card:#111418;--line:#1e2229;--chip:#171b21;--on:#262b34;--acc:#e6e8ec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable","Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 16px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px}
.mk{display:flex;flex-wrap:wrap;gap:4px 18px;margin:12px 0 22px;font-size:13px;color:var(--mut)}
.mk div{padding:0}
.mk b{font-weight:500;margin-right:6px;color:var(--mut)}
.mk span{color:var(--fg)}
.pos{color:var(--up)}.neg{color:var(--dn)}
h2{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.h2sub{color:var(--mut);font-size:13px;margin:-4px 0 12px;line-height:1.55}
section{padding:22px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0;padding-top:4px}
.card{border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.card:last-child{border-bottom:0}
.row{display:flex;align-items:baseline;gap:12px}
.rank{color:var(--dim);font-size:13px;width:20px;font-variant-numeric:tabular-nums}
.name{font-size:17px;font-weight:600;flex:1}
.name small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.p small{font-size:11px;color:var(--mut);font-weight:500;margin-left:5px;letter-spacing:0}
.meta{color:var(--mut);font-size:13px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;padding-left:32px}
.det{display:none;margin-top:14px;padding:14px 0 4px 32px;border-top:1px dashed var(--line)}
.card.open .det{display:block}
.rs{list-style:none;padding:0;margin:0 0 10px}
.rs li{font-size:14px;padding:2px 0;display:flex;gap:8px;color:var(--fg)}
.rs li:before{content:"▲";font-size:10px;margin-top:5px;color:var(--up)}
.rs li.m:before{content:"▼";color:var(--dn)}
.ev{font-size:13px;color:var(--mut)}
.ev a{color:#b7bcc6;text-decoration:none}
.ev a:hover{text-decoration:underline}
.ev div{padding:2px 0}
.chart{width:100%;height:auto;display:block;margin:4px 0 10px}
.an{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 20px;margin:8px 0 12px}
.an h4{grid-column:1/-1;margin:10px 0 0;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.an div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line);color:var(--mut)}
.an div b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--fg)}
.tagline{color:var(--mut);font-size:12px;margin:0 0 8px}
.tagline span{background:var(--chip);border-radius:6px;padding:2px 7px;margin-right:5px;display:inline-block;margin-bottom:4px}
.tabs{display:flex;gap:2px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--mut);border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--on);color:var(--fg)}
.tabs.top{margin:18px 0 6px;border-bottom:1px solid var(--line);gap:0;padding-bottom:0}
.tabs.top button{font-size:14px;padding:10px 14px;border-radius:0;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs.top button.on{color:var(--fg);border-bottom-color:var(--fg)}
.lv{width:100%;border-collapse:collapse;font-size:14px}
.lv th{color:var(--dim);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.lv td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lv tr:last-child td{border-bottom:0}
.lv th:first-child,.lv td:first-child,.lv th.l,.lv td.l{text-align:left;padding-left:0}
.lv th:last-child,.lv td:last-child{padding-right:0}
.lv td.big{font-size:15px;font-weight:600}
.lv .st{font-size:11px;border-radius:4px;padding:2px 6px;background:var(--on);color:var(--mut)}
.lv .st.lim{background:var(--up);color:#fff}
.lv td.l small,.lv small{color:var(--dim);font-size:12px}
.lv .rank{display:inline-block}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:700px){.wrap{padding:20px 16px 64px}.lv{font-size:13px}.lv td{padding:8px 5px}.meta,.det{padding-left:0}.hm{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
.kv b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv>span{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:3px}
.kv b span{font-size:inherit;color:inherit}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:12px}
td:first-child,th:first-child{text-align:left;padding-left:0}
td:last-child,th:last-child{padding-right:0}
.hit{color:var(--up);font-weight:600}
.foot{color:var(--dim);font-size:12px;margin-top:36px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
.halt{font-size:11px;background:rgba(240,86,92,.14);color:#f3a0a3;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-weight:500}
.hist{display:none}.hist.on{display:block}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50}
#lock.on{display:flex}
#lock form{width:min(320px,88vw);display:flex;flex-direction:column;gap:10px}
#lock h1{margin:0 0 2px;font-size:22px}
#lock input[type=password]{font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;font-family:inherit}
#lock button{font-size:15px;padding:11px;border-radius:8px;border:0;background:var(--fg);color:var(--bg);cursor:pointer;font-weight:600;font-family:inherit}
#lock label{color:var(--mut);font-size:13px}
#lock .err{color:var(--up);font-size:13px;min-height:18px}
tr.ex td{opacity:.45}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:4px 0 14px;font-size:13px;color:var(--mut)}
input[type=number],input[type=date]{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:150px;font-variant-numeric:tabular-nums;font-family:inherit}
input:focus{outline:none;border-color:#3a414d}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.btn.ghost{background:var(--on);color:var(--fg);font-weight:500}
.rules{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:12px;color:var(--mut)}.rules span{border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.buy{margin:2px 0;font-size:13px;color:var(--mut)}.buy b{color:var(--fg);font-weight:500}.buy input{width:76px;padding:3px 6px;font-size:13px}
</style>
</head>
<body>
<div id="lock"><form id="lockform" autocomplete="off"><h1>GOOD LUCK</h1><div style="color:var(--mut);font-size:17px;margin:-4px 0 8px">당일 매매 추천</div><input id="pw" type="password" placeholder="비밀번호" autofocus><label><input id="pwkeep" type="checkbox"> 이 기기에서 유지</label><button type="submit">열기</button><div class="err" id="pwerr"></div><div style="color:var(--mut);font-size:15px;margin-top:10px">비밀번호 문의: AI팀 김연주</div></form></div>
<div class="wrap">
  <div class="hdr"><h1 id="title">GOOD LUCK</h1><div class="sub" id="sub">데이터 조회 중</div></div>
  <div class="tabs top" id="toptabs"><button class="on" onclick="setView('morning',this)">추천</button><button onclick="setView('live',this)">실시간</button><button onclick="setView('record',this)">내 기록</button><button onclick="setView('perf',this)">성능</button></div>

  <div id="view-morning">
    <div class="mk" id="mk"></div>
    <section>
      <h2>매수 계획</h2>
      <div class="h2sub" id="plansub"></div>
      <div class="rules"><span>09:00:30 매수</span><span>−5% 손절</span><span>상한가 도달 시 매도</span><span>15:15 전량 매도</span><span>시가 상한가·점수 하위 30% 날 제외</span></div>
      <div class="ctl"><label>투자 금액 <input id="capital" type="number" step="10000" min="0" inputmode="numeric"> 원</label><button class="btn ghost" onclick="applyCapital()">적용</button><button class="btn" onclick="confirmPlan()">매수 확정</button><span id="planmsg" class="ev"></span></div>
      <div id="plan" class="tw"></div>
    </section>
    <section>
      <h2>추천 근거</h2>
            <div id="up"></div>
    </section>
  </div>

  <div id="view-live" style="display:none">
    <div class="sub" id="livesub">데이터 조회 중</div>
    <div class="mk" id="livemk"></div>
    <section><h2>추천 종목</h2><div class="h2sub" id="msum"></div><div id="live-morning" class="tw"></div></section>
    <section><h2>현재 상한가</h2><div id="live-limit" class="tw"></div></section>
    <section><h2>10% 이상 상승</h2><div class="h2sub" id="lockline"></div><div id="live-near" class="tw"></div></section>
  </div>

  <div id="view-record" style="display:none">
    <section>
      <h2>내 기록</h2>
      <div class="h2sub" id="recsub"></div>
      <div class="ctl"><label>날짜 <input id="bal-date" type="date"></label><label>마감 잔고 <input id="bal-amt" type="number" step="1" min="0" inputmode="numeric"> 원</label><button class="btn ghost" onclick="addBalance()">저장</button></div>
      <div id="myrec" class="tw"></div>
    </section>
  </div>

  <div id="view-perf" style="display:none">
    <section>
      <h2>검증 성능</h2>
      <div class="h2sub" id="perfsub"></div>
      <div class="tabs" id="hz"></div>
      <div class="grid" id="stat"></div>
      <div id="monthly"></div>
    </section>
    <section>
      <div class="tabs" style="margin-top:0"><button class="on" data-t="h-rec">실전 기록</button><button data-t="h-perf">학습 추이</button><button data-t="h-up">확률 구간별</button><button data-t="h-imp">중요 변수</button></div>
      <div id="h-rec" class="hist on"></div>
      <div id="h-perf" class="hist"></div>
      <div id="h-up" class="hist"></div>
      <div id="h-imp" class="hist"></div>
    </section>
  </div>

  <div class="foot">자료: 네이버 금융·야후 파이낸스·DART·종목토론방. 모델: LightGBM 앙상블. 전일 종가 기준, 투자 권유 아님.</div>
</div>
<script>
const f=(v,d=1)=>(v*100).toFixed(d)+'%';
const sgn=v=>(v>0?'+':'')+(v*100).toFixed(2)+'%';
const won=v=>v>=1e12?(v/1e12).toFixed(1)+'조':Math.round(v/1e8).toLocaleString()+'억';
const cls=v=>v>0?'pos':v<0?'neg':'';
let DATA=null, BT=null, HZ=12, MODE='all', VIEW='morning', LIVE_T=null, LIVE=null;
const LIVE_URL='https://raw.githubusercontent.com/kjhoeakjy/stock_high_low/live/live.json';
function setView(v,btn){VIEW=v;btn.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');
  for(const k of ['morning','live','record','perf'])document.getElementById('view-'+k).style.display=v===k?'':'none';
  if(v==='record')renderRecord();
  try{localStorage.setItem('view',v)}catch(e){}
  if(v==='live'){loadLive();if(!LIVE_T)LIVE_T=setInterval(()=>{if(VIEW==='live')loadLive();},20000);}}
async function loadLive(){
  let d;try{d=await getJSON(LIVE_URL);}
  catch(e){document.getElementById('livesub').textContent='장중 데이터 없음 · 거래일 09:00 이후 갱신';return;}
  LIVE=d; renderRec(); renderPlan();
  const fmtd=s=>`${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`;
  document.getElementById('livesub').textContent=`${d.at} · 30초 갱신 · 진입·청산 ${d.trades&&d.trades.basis==='호가'?'호가 기준':'시세 기준 추정'}${d.closed?' · 장 마감':''}${d.guard?` · 자동 매매 ${d.guard.halted?'정지('+(d.guard.halt_reason||'')+')':{off:'꺼짐',observe:'관찰',live:'실행'}[d.guard.mode]||d.guard.mode}${d.guard.equity?' · 평가액 '+d.guard.equity.toLocaleString()+'원':''}${d.guard.pending&&Object.keys(d.guard.pending).length?' · 매도 대기 '+Object.keys(d.guard.pending).length+'종목':''}`:''}${d.target_date&&d.date!==d.target_date?' · 장전 후보 '+fmtd(d.target_date)+' 기준':''}`;
  const mk=document.getElementById('livemk');mk.innerHTML='';
  if(d.market.KOSPI)mk.insertAdjacentHTML('beforeend',`<div><b>코스피</b><span class="${cls(d.market.KOSPI.r1)}">${sgn(d.market.KOSPI.r1)}</span></div>`);
  if(d.market.KOSDAQ)mk.insertAdjacentHTML('beforeend',`<div><b>코스닥</b><span class="${cls(d.market.KOSDAQ.r1)}">${sgn(d.market.KOSDAQ.r1)}</span></div>`);
  mk.insertAdjacentHTML('beforeend',`<div><b>상한가</b><span>${d.n_limit}</span></div><div><b>10%↑</b><span>${d.n_up10}</span></div>${d.up_ratio!=null?`<div><b>상승 비율</b><span>${Math.round(d.up_ratio*100)}%</span></div>`:''}`);
  const st=x=>`<span class="st ${x.status=='상한가'?'lim':''}">${x.status}</span>${x.gap!=null&&x.gap>=0.295?'<br><small style="color:var(--mut)">시가 상한가 · 매수 불가 · 제외</small>':''}`;
  const TR=(LIVE&&LIVE.trades&&LIVE.trades.items)||{};
  const tcell=x=>{const t=TR[x.code];if(!t)return '<td>-</td><td>-</td>';if(t.skip)return `<td>-</td><td><small style="color:var(--mut)">${t.skip}</small></td>`;const v=t.net!=null?t.net:t.now;return `<td>${t.entry.toLocaleString()}</td><td class="${cls(v)}">${v==null?'-':sgn(v)}${t.net!=null?'<br><small style="color:var(--mut)">'+(t.exit_why=='상한가'?'상한가 매도 ':t.exit_why=='손절'?'손절 ':'청산 ')+t.exit.toLocaleString()+'</small>':''}</td>`;};
  const row=(x,i,withRank)=>`<tr${withRank&&x.gap!=null&&x.gap>=0.295?' class="ex"':''}><td class="l">${withRank?`<span class="rank">${x.morning_rank||i+1}</span>`:''}<b>${x.name}</b>${x.pref?' <small style="color:var(--mut)">우선주</small>':''}</td><td>${x.p!=null?pf(x.p):'-'}</td><td>${x.price.toLocaleString()}</td><td class="big ${cls(x.ret)}">${sgn(x.ret)}</td><td class="${cls(x.o_ret)}">${x.o_ret==null?'-':sgn(x.o_ret)}</td>${withRank?tcell(x):''}<td>${x.hi_ret==null?'-':sgn(x.hi_ret)}</td><td>${x.status=='상한가'?'도달':f(x.to_limit,1)}</td><td>${x.val!=null?won(x.val):'-'}</td><td>${st(x)}</td></tr>`;
  const head=w=>`<tr><th class="l">종목</th><th>+10% 확률</th><th>현재가</th><th>등락률</th><th>시가 대비</th>${w?'<th>진입가 09:00:30</th><th>진입 대비</th>':''}<th>고가</th><th>상한가 괴리</th><th>거래대금</th><th>상태</th></tr>`;
  const tbl=(rows,withRank)=>rows.length?`<table class="lv">${head(withRank)}${rows.map((x,i)=>row(x,i,withRank)).join('')}</table>`:'<div class="ev" style="margin-bottom:18px">없음</div>';
  const locked=x=>x.gap!=null&&x.gap>=0.295;
  const mrows=(MODE==='common'?d.morning.filter(x=>!x.pref):MODE==='liquid'?d.morning.filter(x=>!x.pref&&x.val!=null):d.morning).slice(0,5).sort((a,b)=>locked(a)-locked(b));
  document.getElementById('live-morning').innerHTML=tbl(mrows,true);
  const nl=mrows.filter(x=>x.status=='상한가').length, nt=mrows.filter(x=>x.status=='도달 후 이탈').length, mr=mrows.length?mrows.reduce((a,x)=>a+x.ret,0)/mrows.length:null, mo=mrows.filter(x=>x.o_ret!=null), moc=mo.length?mo.reduce((a,x)=>a+x.o_ret,0)/mo.length:null;
  const tl=d.trades||null, tline=tl&&tl.n_entered?(tl.net_day!=null?` · <b>09:00:30 진입·규칙 매도 순수익 <span class="${cls(tl.net_day)}">${sgn(tl.net_day)}</span></b>(${tl.n_entered}종목, 비용 차감)`:` · 진입 대비 <b class="${cls(tl.open_day)}">${sgn(tl.open_day)}</b>(${tl.n_entered}종목 09:00:30 진입)`):'';
  const flag=(DATA&&DATA.trade_today===false)?'<span class="halt">미거래일(점수 하위)</span> ':'';
  document.getElementById('msum').innerHTML=mrows.length?`${flag}<b style="color:var(--up)">${mrows.length}종목 중 상한가 ${nl}</b>${nt?` · 도달 후 이탈 ${nt}`:''} · 평균 등락 <b class="${cls(mr)}">${sgn(mr)}</b>${moc!=null?` · 시가 매수 평균 <b class="${cls(moc)}">${sgn(moc)}</b>`:''}${tline}`:'';
  document.getElementById('live-limit').innerHTML=tbl(d.limit,false);
  document.getElementById('live-near').innerHTML=tbl(d.near.slice(0,30),false);
  document.getElementById('lockline').textContent=`장중 상한가 도달 종목의 상한가 마감 비율 ${Math.round(d.lock_rate.all*100)}% · 장전 후보 ${Math.round(d.lock_rate.morning*100)}%`;
}
function setMode(m,btn){MODE=m;btn.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');if(DATA){render('up',DATA.up,'var(--up)');}}
const pf=(v)=>v<0.01?(v*100).toFixed(2)+'%':v<0.1?(v*100).toFixed(1)+'%':(v*100).toFixed(0)+'%';
// ---- 접근 제한: 데이터 파일은 AES-256-GCM(.enc)으로 발행. 비밀번호로 키를 유도해 브라우저에서 복호화.
let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,saltStr,iter){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(saltStr),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptDoc(e){if(!KEY)throw new Error('locked');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},KEY,b64(e.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function getJSON(u){
  const r=await fetch(u+'.enc?'+Date.now(),{cache:'no-store'});
  if(r.ok){const e=await r.json();if(e&&e.ct){if(!KEY)await unlock(e);return decryptDoc(e);}}
  const r2=await fetch(u+'?'+Date.now(),{cache:'no-store'});if(!r2.ok)throw new Error(r2.status);return r2.json();
}
function savedPw(){try{return sessionStorage.getItem('pw')||localStorage.getItem('pw')||'';}catch(e){return '';}}

function groupLine(g){
  if(!g||(!(g.industry||[]).length&&!(g.themes||[]).length)) return '';
  return `<div class="tagline">${(g.industry||[]).map(x=>`<span>업종 ${x}</span>`).join('')}${(g.themes||[]).map(x=>`<span>${x}</span>`).join('')}</div>`;
}
function anGrid(a){
  if(!a||!a.length) return '';
  return `<div class="an">${a.map(s=>`<h4>${s.sec}</h4>`+s.items.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')).join('')}</div>`;
}
function svgOpen(W,H){return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;}
function balSvg(rows){
  const W=760,H=240,pad={l:8,r:90,t:40,b:28}, n=rows.length; if(n<2) return '';
  const v=rows.map(r=>r.bal), hi=Math.max(...v,1000000), lo=Math.min(...v,1000000), LOG=hi/lo>20, tr=b=>LOG?Math.log(b):b;
  const x=i=>pad.l+(W-pad.l-pad.r)*i/(n-1), y=b=>pad.t+(tr(hi)-tr(b))/(tr(hi)-tr(lo)||1)*(H-pad.t-pad.b);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><text x="${pad.l}" y="22" fill="#8b919c" font-size="13">100만 원 시작 잔고 추이(복리${LOG?', 로그 눈금':''})</text>`;
  for(let i=0;i<=4;i++){const b=LOG?Math.exp(Math.log(lo)+(Math.log(hi)-Math.log(lo))*i/4):lo+(hi-lo)*i/4, yy=y(b); s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#262a33"/><text x="${W-pad.r+6}" y="${yy+5}" fill="#8b919c" font-size="13">${Math.round(b/10000).toLocaleString()}만</text>`;}
  s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(1000000)}" y2="${y(1000000)}" stroke="#8b919c" stroke-dasharray="4 4"/>`;
  s+=`<polyline points="${rows.map((r,i)=>`${x(i)},${y(r.bal)}`).join(' ')}" fill="none" stroke="${v[n-1]>=1000000?'#ff4d4d':'#4d8cff'}" stroke-width="2"/>`;
  const lab=i=>{const d=rows[i].d;return `${d.slice(2,4)}.${d.slice(4,6)}`;};
  for(const i of [0,Math.floor(n/2),n-1]) s+=`<text x="${x(i)}" y="${H-8}" fill="#8b919c" font-size="13" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${lab(i)}</text>`;
  return s+'</svg>';
}
function monthlySvg(m){
  if(!m.length) return '';
  const W=760,H=200,pad={l:8,r:70,t:44,b:26}, n=m.length, xw=(W-pad.l-pad.r)/n, ph=H-pad.t-pad.b;
  const rate=m.map(x=>x['p@5']!=null?x['p@5']:x['p@10']), top=Math.max(0.5,...rate), posmax=Math.max(1,...m.map(x=>x.pos));
  let s=svgOpen(W,H)+`<text x="${pad.l}" y="16" fill="#8b919c" font-size="13">${DATA&&DATA.stats.y_oc10?'월별 상위5 +10% 달성률 · 전체 +10% 종목 수(선)':'월별 상위5 적중률 · 상한가 발생 수(선)'}</text>`;
  [0.25,0.5].forEach(v=>{if(v<=top){const yy=pad.t+ph*(1-v/top); s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#262a33"/><text x="${W-pad.r+6}" y="${yy+4}" fill="#8b919c" font-size="12">${v*100}%</text>`;}});
  m.forEach((x,i)=>{const r=rate[i]||0, bh=ph*r/top, X=pad.l+xw*i; s+=`<rect x="${X+xw*.15}" y="${pad.t+ph-bh}" width="${xw*.7}" height="${bh}" fill="#ff4d4d" opacity=".8"/><text x="${X+xw/2}" y="${pad.t+ph-bh-4}" fill="#f2f3f5" font-size="12" text-anchor="middle">${Math.round(r*100)}%</text><text x="${X+xw/2}" y="${H-8}" fill="#8b919c" font-size="12" text-anchor="middle">${x.ym.slice(2,4)}.${x.ym.slice(4)}</text>`;});
  s+=`<polyline fill="none" stroke="#e0b64d" stroke-width="2" points="${m.map((x,i)=>`${pad.l+xw*(i+.5)},${pad.t+ph*(1-x.pos/posmax)}`).join(' ')}"/>`;
  {const i=m.length-1, x=pad.l+xw*(i+.5), y=pad.t+ph*(1-m[i].pos/posmax); s+=`<circle cx="${x}" cy="${y}" r="3" fill="#e0b64d"/><text x="${x-6}" y="${y-6}" fill="#e0b64d" font-size="12" text-anchor="end">${m[i].pos}건</text>`;}
  return s+'</svg>';
}
function liveSvg(h){
  if(h.length<2) return '';
  const W=760,H=200,pad={l:8,r:70,t:28,b:26}, n=h.length, xw=(W-pad.l-pad.r)/n, ph=H-pad.t-pad.b;
  let cum=0, cumn=0, eq=1; const rate=[], eqs=[];
  h.forEach(x=>{cum+=x.up_hits; cumn+=Math.min(5,(x.up||[]).length)||5; rate.push(cum/cumn); const oc=x.up_mean_oc; if(oc!=null) eq*=1+oc-0.003; eqs.push(eq);});
  const emax=Math.max(...eqs,1.0001), emin=Math.min(...eqs,1);
  let s=svgOpen(W,H)+`<text x="${pad.l}" y="16" fill="#8b919c" font-size="13">실전 누적 적중률(적색, 좌축) · 시가 매수 누적 수익(황색, 우축)</text>`;
  [0.25,0.5].forEach(v=>{const yy=pad.t+ph*(1-v); s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#262a33"/><text x="${pad.l+2}" y="${yy-3}" fill="#ff4d4d" font-size="11" opacity=".8">${v*100}%</text>`;});
  h.forEach((x,i)=>{const bh=ph*Math.min(1,x.up_hits/5); s+=`<rect x="${pad.l+xw*i+xw*.2}" y="${pad.t+ph-bh}" width="${xw*.6}" height="${bh}" fill="#ff4d4d" opacity=".35"/>`;});
  s+=`<polyline fill="none" stroke="#ff4d4d" stroke-width="2" points="${rate.map((r,i)=>`${pad.l+xw*(i+.5)},${pad.t+ph*(1-Math.min(1,r))}`).join(' ')}"/>`;
  s+=`<polyline fill="none" stroke="#e0b64d" stroke-width="2" points="${eqs.map((e,i)=>`${pad.l+xw*(i+.5)},${pad.t+ph*(1-(e-emin)/(emax-emin||1))}`).join(' ')}"/>`;
  s+=`<text x="${W-pad.r+6}" y="${pad.t+4}" fill="#e0b64d" font-size="12">${((emax-1)*100).toFixed(0)}%</text><text x="${W-pad.r+6}" y="${pad.t+ph+4}" fill="#e0b64d" font-size="12">${((emin-1)*100).toFixed(0)}%</text>`;
  [0,n-1].forEach(i=>{const d=h[i].target_date; s+=`<text x="${pad.l+xw*(i+.5)}" y="${H-8}" fill="#8b919c" font-size="12" text-anchor="middle">${d.slice(4,6)}.${d.slice(6)}</text>`;});
  return s+'</svg>';
}
function perfSvg(pf){
  const info='';
  if(pf.length<2) return info+`<table><tr><th>학습 기준일</th><th>학습 데이터</th><th>변수</th><th>검증 상위5 적중률</th><th>AP</th><th>AUC</th><th>시가 매수 평균</th></tr>${pf.map(x=>`<tr><td>${x.as_of}</td><td>${(x.train_rows||0).toLocaleString()}행</td><td>${x.n_features}</td><td>${f(x['p@5']||0,1)}</td><td>${(x.ap||0).toFixed(3)}</td><td>${(x.auc||0).toFixed(3)}</td><td class="${cls(x['oc@5'])}">${x['oc@5']==null?'':sgn(x['oc@5'])}</td></tr>`).join('')}</table>`;
  const W=760,H=200,pad={l:8,r:70,t:28,b:26}, n=pf.length, xw=(W-pad.l-pad.r)/Math.max(1,n-1), ph=H-pad.t-pad.b;
  const p5=pf.map(x=>x['p@5']||0), lv=pf.map(x=>x.live_rate), top=Math.max(0.5,...p5,...lv.filter(x=>x!=null));
  let s=svgOpen(W,H)+`<text x="${pad.l}" y="16" fill="#8b919c" font-size="13">검증 상위5 적중률(적색) · 실전 누적 적중률(황색)</text>`;
  [0.25,0.5].forEach(v=>{if(v<=top){const yy=pad.t+ph*(1-v/top); s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#262a33"/><text x="${W-pad.r+6}" y="${yy+4}" fill="#8b919c" font-size="12">${v*100}%</text>`;}});
  s+=`<polyline fill="none" stroke="#ff4d4d" stroke-width="2" points="${p5.map((r,i)=>`${pad.l+xw*i},${pad.t+ph*(1-r/top)}`).join(' ')}"/>`;
  const lp=lv.map((r,i)=>r==null?null:`${pad.l+xw*i},${pad.t+ph*(1-r/top)}`).filter(Boolean); if(lp.length>1) s+=`<polyline fill="none" stroke="#e0b64d" stroke-width="2" points="${lp.join(' ')}"/>`;
  [0,n-1].forEach(i=>{const d=pf[i].as_of; s+=`<text x="${pad.l+xw*i}" y="${H-8}" fill="#8b919c" font-size="12" text-anchor="${i?'end':'start'}">${d.slice(4,6)}.${d.slice(6)}</text>`;});
  const last=pf[n-1], first=pf[0];
  return info+s+'</svg>'+`<div class="ev">학습 데이터 ${(last.train_rows||0).toLocaleString()}행(최초 ${(first.train_rows||0).toLocaleString()}행) · 변수 ${last.n_features}개 · 검증 적중률 ${f(last['p@5']||0,1)}(최초 ${f(first['p@5']||0,1)})</div>`;
}
function stats(d){
  const trade=!!d.stats.y_oc10, base=trade?d.stats.y_oc10:d.stats.y_up, g=document.getElementById('stat');
  const hzD=base.horizons||{}, hzB=(trade&&BT&&BT.horizons)||{};
  const avail=[1,6,12,36].filter(h=>hzD[h]||hzB[h]); if(!avail.length)avail.push(12);
  if(!avail.includes(HZ))HZ=avail.includes(12)?12:avail[avail.length-1];
  const su=hzD[HZ]||hzB[HZ]||base, fromBT=!hzD[HZ]&&!!hzB[HZ];
  document.getElementById('hz').innerHTML=avail.map(h=>`<button class="${h===HZ?'on':''}" data-h="${h}">${h}개월</button>`).join('')+(hzB[36]||hzD[36]?'':'<button disabled style="opacity:.5">36개월(주간 검증 대기)</button>');
  document.querySelectorAll('#hz button[data-h]').forEach(b=>b.onclick=()=>{HZ=+b.dataset.h;try{localStorage.setItem('gl_hz',HZ);}catch(e){}stats(DATA);});
  const HM=`${HZ}개월`;
  const kv=(b,s,d)=>`<div class="kv"><b>${b}</b><span>${s}</span>${d?`<small>${d}</small>`:''}</div>`;
  const pct=v=>`<span class="${cls(v)}">${sgn(v)}</span>`, net=su.net||null;
  const upRate=trade?su['up@5']:su['p@5'], tenRate=trade?su['p@5']:su['up10@5'];
  const sim=su.sim||null, simp=su.sim_policy||null, won0=v=>Math.round(v).toLocaleString()+'원';
  const simTiles=sim?kv(`<span class="${cls(sim.cum)}">${won0(sim.final)}</span>`,`${HM} 전 100만 원 시작 시 현재 잔고(복리)`)+(sim.fixed_pnl!=null?kv(`<span class="${cls(sim.fixed_cum)}">${(sim.fixed_pnl>=0?'+':'')+won0(sim.fixed_pnl)}</span>`,`매일 100만 원 투자 시 ${HM} 누적 손익`):'')+kv(pct(sim.mdd),'최대 낙폭'):'';
  g.innerHTML=simTiles+(net&&net.trade_day!=null?kv(pct(net.trade_day),'거래일 평균 순수익')+kv(f(net.trade_loss_days,0),'손실일 비율')+kv(pct(net.trade_worst),'최악 거래일')+kv(f(1-net.trade_frac,0),'미거래일 비율'):'')
    +(su['oc10@5']!=null?kv(f(su['oc10@5'],0),'추천 종목 중 +10% 도달'):'')+(su['oc_win@5']!=null?kv(f(su['oc_win@5'],0),'추천 종목 중 수익 마감'):'')+(su['unbuyable@5']!=null?kv(f(su['unbuyable@5'],0),'시가 상한가(매수 불가) 비율'):'');
  const bt=(s)=>`<table><tr><th>모델 확률</th><th>건수</th><th>${trade?'+10% 달성률':'적중률'}</th></tr>${s.buckets.map(b=>`<tr><td>${pf(b.lo)} ~ ${pf(Math.min(b.hi,1))}</td><td>${b.n.toLocaleString()}</td><td>${pf(b.rate)}</td></tr>`).join('')}</table>
    <table><tr><th>월</th><th>거래일</th><th>${trade?'+10% 종목 수':'상한가 발생'}</th><th>${trade?'상위5 +10%':'상위5 적중률'}</th><th>${trade?'상위5 상한가':'+10% 이상'}</th><th>시가 갭</th><th>시가 매수 수익</th><th>순수익</th></tr>${s.monthly.map(m=>`<tr><td>${m.ym.slice(0,4)}.${m.ym.slice(4)}</td><td>${m.days}</td><td>${m.pos}</td><td>${f(m['p@5'],0)}</td><td>${trade?(m['up@5']!=null?f(m['up@5'],0):'-'):(m['up10@5']!=null?f(m['up10@5'],0):'-')}</td><td class="${cls(m['gap@5'])}">${m['gap@5']==null?'':sgn(m['gap@5'])}</td><td class="${cls(m['oc@5'])}">${m['oc@5']==null?'':sgn(m['oc@5'])}</td><td class="${cls(m['net@5'])}">${m['net@5']==null?'':sgn(m['net@5'])}</td></tr>`).join('')}</table>`;
  document.getElementById('h-up').innerHTML=bt(su);
  const imp=(t)=>Object.entries(d.importance[t]).slice(0,25).map(([k,v])=>`<tr><td>${k}</td><td>${Math.round(v).toLocaleString()}</td></tr>`).join('');
  document.getElementById('h-imp').innerHTML=`<table><tr><th>변수</th><th>기여</th></tr>${imp(trade?'y_oc10':'y_up')}</table>`;
  document.getElementById('perfsub').textContent=`최근 ${HM} ${su.days}거래일 워크포워드 · 매일 상위 5종목 · 시가 매수, 손절 −6%, 종가 매도, 비용 0.53%${fromBT?` · 주간 장기 검증 ${BT.generated_at.slice(0,10)}`:''}`;
  document.getElementById('monthly').innerHTML=(sim&&sim.daily?balSvg(sim.daily):'')+monthlySvg(su.monthly||[]);
  document.getElementById('h-perf').innerHTML=perfSvg(d.perf||[]);
  renderRec();
  document.querySelectorAll('#view-perf .tabs button[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#view-perf .tabs button[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.hist').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.t).classList.add('on');});
}
function provisionalRow(){
  // 당일 결과 잠정 행: 장중 시세 기준(정식 채점은 익영업일 아침)
  if(!DATA||!LIVE||LIVE.date!==DATA.target_date) return null;
  const m=(LIVE.morning||[]).filter(x=>x.morning_rank&&x.morning_rank<=5);
  if(!m.length) return null;
  const buy=m.filter(x=>x.o_ret!=null&&(x.gap==null||x.gap<0.295));
  return {target_date:LIVE.date, provisional:true, actual_up_count:LIVE.n_limit, up_hits:m.filter(x=>x.status=='상한가').length,
    up_10:m.filter(x=>x.ret>=0.10).length, up_touch:m.filter(x=>x.status=='상한가'||x.status=='도달 후 이탈').length,
    up_mean_ret:m.reduce((a,x)=>a+x.ret,0)/m.length, up_mean_oc:buy.length?buy.reduce((a,x)=>a+x.o_ret,0)/buy.length:null,
    trade_net_day:(LIVE.trades&&LIVE.trades.net_day!=null)?LIVE.trades.net_day:null, trade_flag:LIVE.trades?LIVE.trades.trade:null,
    up:m.map(x=>({name:x.name,ret:x.ret,hit:x.status=='상한가'}))};
}
function renderRec(){
  const d=DATA; if(!d) return;
  const hall=(d.history||[]).filter(x=>x.graded);
  const pr=provisionalRow();
  const h=hall.slice(-20).reverse(); if(pr&&!hall.some(x=>x.target_date===pr.target_date)) h.unshift(pr);
  document.getElementById('h-rec').innerHTML=liveSvg(hall)+(h.length?`<table><tr><th>날짜</th><th>상한가 발생</th><th>상위5 적중</th><th>+10% 이상</th><th>장중 도달</th><th>평균 등락</th><th>시가 매수 수익</th><th>진입·청산 순수익</th><th>후보 결과</th></tr>${h.map(x=>`<tr><td>${x.target_date.slice(4,6)}.${x.target_date.slice(6)}${x.provisional?'<br><small style="color:var(--mut)">잠정</small>':''}</td><td>${x.actual_up_count}</td><td class="${x.up_hits?'hit':''}">${x.up_hits}</td><td>${x.up_10!=null?x.up_10:'-'}</td><td>${x.up_touch}</td><td class="${cls(x.up_mean_ret)}">${x.up_mean_ret==null?'':sgn(x.up_mean_ret)}</td><td class="${cls(x.up_mean_oc)}">${x.up_mean_oc==null?'':sgn(x.up_mean_oc)}</td><td class="${cls(x.trade_net_day)}">${x.trade_net_day==null?'-':sgn(x.trade_net_day)}${x.trade_flag===false?'<br><small style="color:var(--mut)">미거래일</small>':''}</td><td style="white-space:normal;text-align:left">${x.up.map(u=>`<span class="${u.hit?'hit':''}">${u.name} ${u.ret==null?'':sgn(u.ret)}</span>`).join(' · ')}</td></tr>`).join('')}</table>`:'<div class="ev">채점 기록 없음 · 익영업일 표시</div>');
}
main().catch(e=>{document.getElementById('sub').textContent='데이터 없음';});
try{const v=localStorage.getItem('view'),i=['morning','live','record','perf'].indexOf(v);if(i>0)setView(v,document.querySelectorAll('#toptabs button')[i]);}catch(e){}
</script>
